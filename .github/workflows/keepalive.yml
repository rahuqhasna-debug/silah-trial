# بيصحّي قاعدة Supabase كل 3 أيام عشان المجاني مايوقفش بعد 7 أيام من غير استخدام.
# محتاج Secrets في الريبو: SUPABASE_URL و SUPABASE_ANON_KEY
name: keepalive
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          test "$code" = "200"
